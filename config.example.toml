[general]
host = "0.0.0.0"
port = 5090

[auth]
cookie_max_uses = 7
cookie_storage_size = 2
max_auth_attempts = 3

[auth.proxy]
cooldown = 3600
max_uses_before_rotation = 100

[browser]
restart_after_consecutive_failures = 30
restart_after_sessions = 100

[timeouts]
cdp = 10
js_challenge = 100

